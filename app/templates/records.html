{% extends "base.html" %}
{% block main_class %}main-wide{% endblock %}
{% block content %}
<h1>출석인정허가원 사용 기록 ({{ term }})</h1>

<form method="get" class="search-bar" id="records-search-form">
  <input type="text" name="q" id="records-search-input" placeholder="본인의 학번 또는 이름으로 검색" value="{{ q }}" autocomplete="off" autofocus>
  <button type="submit" class="btn primary">조회</button>
</form>

<form method="post" action="{{ url_for('records_delete') }}" id="records-delete-form">
  <input type="hidden" name="q" id="records-q-hidden" value="{{ q }}">
  <input type="hidden" class="js-admin-verified" id="records-verified" value="">
  <div class="admin-token-row">
    <label>관리자 토큰
      <input type="password" name="admin_token" id="records-admin-token" class="js-admin-token" autocomplete="off"></label>
    <button type="button" id="records-admin-confirm" class="btn">확인</button>
    <span class="hint">토큰을 입력하고 확인을 누르면 전체 기록 조회와 삭제가 가능합니다.</span>
  </div>

  <div id="record-results">
    {% include "_records_results.html" %}
  </div>
</form>

<script>
  // 검색창에 입력할 때마다 결과 표(#record-results)만 fetch로 갈아끼운다.
  // 삭제 폼은 그대로 유지되므로 검색 후에도 관리자 토큰 입력값이 지워지지 않는다.
  (function () {
    var input = document.getElementById("records-search-input");
    var form = document.getElementById("records-search-form");
    var results = document.getElementById("record-results");
    var qHidden = document.getElementById("records-q-hidden");
    var timer = null;

    function runSearch() {
      var q = input.value.trim();
      fetch("/records/search?q=" + encodeURIComponent(q))
        .then(function (res) { return res.text(); })
        .then(function (html) {
          results.innerHTML = html;
          qHidden.value = q;
          App.hydrateAll(results);
          var newUrl = q ? "/records?q=" + encodeURIComponent(q) : "/records";
          history.replaceState(null, "", newUrl);
        });
    }

    input.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(runSearch, 250);
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      clearTimeout(timer);
      runSearch();
    });

    // 방금 출석인정허가원을 발급한 학생이 있으면 (생성 확인 폼이 남겨둔
    // localStorage 값), 검색어를 직접 입력하지 않은 첫 진입 시 그 학생의
    // 기록으로 바로 조회해 준다.
    if (!input.value.trim()) {
      var lastStudent = App.getLastStudent();
      if (lastStudent) {
        input.value = lastStudent;
        runSearch();
      }
    }
  })();

  // 관리자 토큰을 입력하고 "확인"을 누르면 서버에 실제로 검증한 뒤 전체
  // 기록을 보여주고, 그 결과로만 삭제 버튼들이 활성화된다 (App.applyAdminGate,
  // app.js). 토큰을 다시 고치면 재확인 전까지 다시 잠긴다.
  (function () {
    var tokenInput = document.getElementById("records-admin-token");
    var confirmBtn = document.getElementById("records-admin-confirm");
    var verifiedFlag = document.getElementById("records-verified");
    var results = document.getElementById("record-results");
    var searchInput = document.getElementById("records-search-input");

    confirmBtn.addEventListener("click", function () {
      var token = tokenInput.value.trim();
      if (!token) {
        alert("관리자 토큰을 입력해 주세요.");
        return;
      }
      confirmBtn.disabled = true;
      confirmBtn.textContent = "확인 중...";
      fetch("/records/admin_view", {
        method: "POST",
        body: new URLSearchParams({ admin_token: token }),
      })
        .then(function (res) {
          if (!res.ok) throw new Error("unauthorized");
          return res.text();
        })
        .then(function (html) {
          verifiedFlag.value = "1";
          results.innerHTML = html;
          App.hydrateAll(results);
          searchInput.value = "";
          history.replaceState(null, "", "/records");
        })
        .catch(function () {
          verifiedFlag.value = "";
          App.hydrateAll(results);
          alert("관리자 토큰이 올바르지 않습니다.");
        })
        .then(function () {
          confirmBtn.disabled = false;
          confirmBtn.textContent = "확인";
        });
    });
  })();
</script>
{% endblock %}
